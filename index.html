<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>

<body onload="meow()">
    <div class="otherotherotherWrapper">
        <div class="otherotherWrapper">
            <p id="output">meow</p>
            <input id="input" type="text" onkeydown="handleInputKeydown(event)">
        </div>
        <div class="otherWrapper">
            <div class="parenthesis">
                <button type="button" onclick="appendChar('(')">(</button>
                <button type="button" onclick="appendChar(')')">)</button>
            </div>
            <div class="history">
                <button type="button" onclick="seekPrev()"><-</button>
                <button type="button" onclick="seekNext()">-></button>
            </div>
        </div>
        <div class="wrapper">
            <div class="digitGrid">
                <button type="button" onclick="appendChar('7')">7</button>
                <button type="button" onclick="appendChar('8')">8</button>
                <button type="button" onclick="appendChar('9')">9</button>
                <button type="button" onclick="appendChar('4')">4</button>
                <button type="button" onclick="appendChar('5')">5</button>
                <button type="button" onclick="appendChar('6')">6</button>
                <button type="button" onclick="appendChar('1')">1</button>
                <button type="button" onclick="appendChar('2')">2</button>
                <button type="button" onclick="appendChar('3')">3</button>
                <button type="button" class="exception" onclick="appendChar('.')">.</button>
                <button type="button" onclick="appendChar('0')">0</button>
                <button type="button" class="exception" onclick="evaluateStuff()">=</button>
            </div>
            <div class="operatorGrid">
                <button type="button" onclick="appendChar('^')">^</button>
                <button type="button" onclick="appendChar('%')">%</button>
                <button type="button" onclick="appendChar('/')">/</button>
                <button type="button" onclick="appendChar('*')">*</button>
                <button type="button" onclick="appendChar('-')">-</button>
                <button type="button" onclick="appendChar('+')">+</button>
            </div>
        </div>
    </div>
</body>

</html>
